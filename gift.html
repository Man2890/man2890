<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Surprise For You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a1a;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            cursor: none;
        }

        /* 自定义光标 */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s;
            mix-blend-mode: difference;
        }

        .cursor-dot {
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 流星 */
        .meteor {
            position: fixed;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, transparent, #fff);
            animation: meteor 1.5s linear forwards;
            z-index: 1;
        }

        @keyframes meteor {
            0% { transform: translateY(-100px) rotate(45deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 礼物盒 */
        .gift-box {
            position: relative;
            width: 150px;
            height: 150px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .gift-box:hover {
            transform: scale(1.05);
        }

        .gift-box.opened {
            animation: giftOpen 0.8s forwards;
        }

        @keyframes giftOpen {
            0% { transform: scale(1); }
            30% { transform: scale(1.2) rotate(-5deg); }
            60% { transform: scale(1.3) rotate(5deg); }
            100% { transform: scale(1) translateY(-50px); opacity: 0; }
        }

        .gift-body {
            position: absolute;
            bottom: 0;
            width: 150px;
            height: 100px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 30px rgba(238, 90, 36, 0.4);
        }

        .gift-body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 100%;
            background: linear-gradient(135deg, #ffd93d, #ff9f43);
        }

        .gift-body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 30px;
            background: linear-gradient(135deg, #ffd93d, #ff9f43);
        }

        .gift-lid {
            position: absolute;
            top: 0;
            width: 170px;
            height: 40px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 10px;
            left: 50%;
            transform: translateX(-50%);
            transition: transform 0.5s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .gift-lid::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 30px;
            background: linear-gradient(135deg, #ffd93d, #ff9f43);
            border-radius: 50% 50% 0 0;
        }

        .gift-box.opened .gift-lid {
            transform: translateX(-50%) translateY(-80px) rotate(-30deg);
            opacity: 0;
        }

        /* 弹出内容 */
        .message {
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
            max-width: 500px;
        }

        .message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .message h1 {
            font-size: 3em;
            background: linear-gradient(90deg, #f093fb, #f5576c, #ffd93d, #4facfe);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s ease infinite;
            margin-bottom: 20px;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .message p {
            font-size: 1.2em;
            color: #a0a0c0;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .message .date {
            font-size: 0.9em;
            color: #666;
            margin-top: 20px;
        }

        /* 爱心粒子 */
        .heart-particle {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            animation: float-up 3s ease-out forwards;
            z-index: 100;
        }

        @keyframes float-up {
            0% { 
                opacity: 1; 
                transform: translateY(0) scale(1) rotate(0deg); 
            }
            100% { 
                opacity: 0; 
                transform: translateY(-400px) scale(0.5) rotate(360deg); 
            }
        }

        /* 提示文字 */
        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-size: 0.9em;
            z-index: 10;
            transition: opacity 0.5s;
        }

        .hint.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 点击特效 */
.click-ripple {
    position: fixed;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.35), transparent);
    pointer-events: none;
    width: 100px;
    height: 100px;
    transform: scale(0);
    will-change: transform, opacity;
    animation: ripple 0.6s ease-out forwards;
}

@keyframes ripple {
    0% {
        transform: scale(0);
        opacity: 1;
    }
    100% {
        transform: scale(1);
        opacity: 0;
    }
}      /* 按钮 */
        .btn-replay {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            opacity: 0;
            transition: all 0.5s;
            transform: translateY(20px);
        }

        .btn-replay.show {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-replay:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        /* 隐藏的彩蛋 */
        .easter-egg {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            opacity: 0.1;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 50;
        }

        .easter-egg:hover {
            opacity: 1;
            transform: rotate(360deg) scale(1.2);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .message h1 {
                font-size: 2em;
            }
            .message p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-dot" id="cursorDot"></div>
    
    <canvas class="stars" id="starsCanvas"></canvas>
    
    <div class="container">
        <div class="gift-box" id="giftBox">
            <div class="gift-lid"></div>
            <div class="gift-body"></div>
        </div>
        
        <div class="message" id="message">
            <h1>✨ 惊喜送给你 ✨</h1>
            <p>
                生活就像一颗星球，<br>
                有时候黑暗，有时候明亮。<br>
                但请记得，<br>
                每一颗星星都在为你闪烁。<br><br>
                🌟 愿你今天心情愉快 🌟
            </p>
            <div class="date" id="date"></div>
            <br>
            <button class="btn-replay" id="replayBtn">🎁 再来一次</button>
        </div>
    </div>

    <div class="hint" id="hint">🎁 点击礼物盒开启惊喜</div>

    <!-- 隐藏彩蛋 -->
    <div class="easter-egg" id="easterEgg" title="秘密">⭐</div>

    <script>
        // ===== 自定义光标 =====
        

        // ===== 星空背景 =====
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.5 + 0.1,
                twinkle: Math.random() * Math.PI * 2
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.twinkle += 0.02;
                const alpha = 0.3 + Math.sin(star.twinkle) * 0.3;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
                
                // 流星效果
                if (Math.random() < 0.001) {
                    createMeteor();
                }
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // ===== 流星 =====
        function createMeteor() {
            const meteor = document.createElement('div');
            meteor.className = 'meteor';
            meteor.style.left = Math.random() * window.innerWidth + 'px';
            meteor.style.top = '-100px';
            document.body.appendChild(meteor);
            setTimeout(() => meteor.remove(), 1500);
        }

        // ===== 礼物盒点击 =====
        const giftBox = document.getElementById('giftBox');
        const message = document.getElementById('message');
        const hint = document.getElementById('hint');
        const replayBtn = document.getElementById('replayBtn');
        let opened = false;

        giftBox.addEventListener('click', () => {
            if (opened) return;
            opened = true;
            
            giftBox.classList.add('opened');
            hint.classList.add('hidden');
            
            // 创建爱心爆发效果
            for (let i = 0; i < 20; i++) {
                setTimeout(() => createHeart(), i * 100);
            }
            
            setTimeout(() => {
                giftBox.style.display = 'none';
                message.classList.add('show');
                replayBtn.classList.add('show');
            }, 800);
        });

        // ===== 爱心粒子 =====
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerHTML = ['💖', '✨', '🌟', '💫', '⭐', '🎉', '🎊'][Math.floor(Math.random() * 7)];
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = window.innerHeight + 'px';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }

        // ===== 点击特效 =====
        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = e.clientX - 50 + 'px';
            ripple.style.top = e.clientY - 50 + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        // ===== 显示日期 =====
        const dateEl = document.getElementById('date');
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        dateEl.textContent = now.toLocaleDateString('zh-CN', options);

        // ===== 重播按钮 =====
        replayBtn.addEventListener('click', () => {
            opened = false;
            message.classList.remove('show');
            replayBtn.classList.remove('show');
            giftBox.style.display = 'block';
            giftBox.classList.remove('opened');
            hint.classList.remove('hidden');
            
            // 再次爆发爱心
            for (let i = 0; i < 15; i++) {
                setTimeout(() => createHeart(), i * 80);
            }
        });

        // ===== 隐藏彩蛋 =====
        document.getElementById('easterEgg').addEventListener('click', () => {
            alert('🎉 恭喜你发现了秘密！\n\n你们是最特别的人。\n\n—— 来自HCY的彩蛋 🎁');
        });

        // ===== 触摸支持 =====
        giftBox.addEventListener('touchstart', () => {
            giftBox.click();
        });
    </script>
</body>
  </html>
